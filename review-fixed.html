<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Campus | STT Cipasung</title>
	<style>
		body {
			max-width: 960px;
			margin: 0 auto;
			padding: 0 16px;
			background: #f4f6f8;
			color: #263238;
			font-family: Arial, sans-serif;
			line-height: 1.6;
		}

		.site-header {
			padding: 20px;
			background: #003366;
			color: #fff;
		}

		.site-header h1 {
			margin-top: 0;
		}

		.site-nav ul {
			display: flex;
			flex-wrap: wrap;
			gap: 8px 20px;
			margin: 0;
			padding: 0;
			list-style: none;
		}

		.site-nav a {
			color: #fff;
		}

		.site-nav a:hover,
		.site-nav a:focus-visible {
			color: #ffd27d;
		}

		main {
			padding-top: 24px;
		}

		.card {
			margin-bottom: 24px;
			padding: 16px;
			border: 1px solid #c5ced6;
			border-radius: 8px;
			background: #fff;
		}

		img {
			display: block;
			max-width: 100%;
			height: auto;
		}

		label {
			display: block;
			margin-bottom: 4px;
		}

		input {
			box-sizing: border-box;
			width: 100%;
			margin-bottom: 16px;
			padding: 8px;
			border: 1px solid #687780;
			border-radius: 4px;
			font: inherit;
		}

		button {
			padding: 8px 16px;
			border: 0;
			border-radius: 4px;
			background: #003366;
			color: #fff;
			font: inherit;
			cursor: pointer;
		}

		footer {
			padding: 8px 0 24px;
			color: #4b5961;
			font-size: 0.875rem;
			text-align: center;
		}
	</style>
</head>
<body>
	<header class="site-header" id="top">
		<h1>STT Cipasung</h1>
		<nav class="site-nav" aria-label="Main navigation">
			<ul>
				<li><a href="#top">Home</a></li>
				<li><a href="#about">About</a></li>
				<li><a href="#contact">Contact</a></li>
			</ul>
		</nav>
	</header>
	<main>
		<section class="card" id="about" aria-labelledby="about-title">
			<h2 id="about-title">About Us</h2>
			<p>STT Cipasung is a technology college in Tasikmalaya.</p>
			<img src="https://placehold.co/600x300?text=STT+Cipasung" alt="Illustration representing STT Cipasung campus">
		</section>
		<section class="card" id="contact" aria-labelledby="contact-title">
			<h2 id="contact-title">Contact Us</h2>
			<form action="#" method="post">
				<p>
					<label for="name">Name</label>
					<input type="text" id="name" name="name" autocomplete="name" required>
				</p>
				<p>
					<label for="email">Email</label>
					<input type="email" id="email" name="email" autocomplete="email" required>
				</p>
				<button type="submit">Send</button>
			</form>
		</section>
	</main>
	<footer>
		<p>Copyright 2026 STT Cipasung</p>
	</footer>
</body>
</html>
