<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>STT Cipasung - Profil Kampus</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      color: #333333;
      background-color: #f4f6f8;
    }
    header {
      background-color: #003366;
      color: #ffffff;
      padding: 20px;
      max-width: 1200px;
      margin: 0 auto;
    }
    h1 {
      margin: 0 0 10px 0;
      font-size: 32px;
    }
    nav a {
      color: #e0e0e0;
      margin-right: 15px;
      text-decoration: none;
    }
    nav a:hover {
      color: #ffffff;
      text-decoration: underline;
    }
    main {
      max-width: 1200px;
      margin: 20px auto;
      padding: 20px;
      background-color: #ffffff;
    }
    h2 {
      font-size: 24px;
      color: #003366;
      margin-top: 20px;
    }
    p {
      line-height: 1.6;
    }
    img {
      max-width: 100%;
      height: auto;
      margin: 15px 0;
    }
    form p {
      margin-bottom: 15px;
    }
    label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
    }
    input[type="text"],
    input[type="email"] {
      width: 100%;
      max-width: 400px;
      padding: 8px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    button {
      background-color: #003366;
      color: #ffffff;
      padding: 10px 20px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover {
      background-color: #002244;
    }
    footer {
      background-color: #003366;
      color: #ffffff;
      text-align: center;
      padding: 15px;
      margin-top: 20px;
    }
  </style>
</head>
<body>

  <header>
    <h1>STT Cipasung</h1>
    <nav>
      <a href="#">Home</a>
      <a href="#">Programs</a>
      <a href="#">Contact</a>
    </nav>
  </header>

  <main>
    <section>
      <h2>About Us</h2>
      <p>STT Cipasung is a technology college in Tasikmalaya.</p>
      <img src="https://placehold.co/600x300?text=STT+Cipasung" alt="Kampus STT Cipasung">
    </section>

    <section>
      <h2>Contact Us</h2>
      <form action="#" method="post">
        <p>
          <label for="name">Name:</label>
          <input type="text" id="name" name="name" placeholder="Name" required>
        </p>
        <p>
          <label for="email">Email:</label>
          <input type="email" id="email" name="email" placeholder="Email" required>
        </p>
        <p>
          <button type="submit">Send</button>
        </p>
      </form>
    </section>
  </main>

  <footer>
    <p>Copyright 2026</p>
  </footer>

</body>
</html>
