<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>STT Cipasung</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      line-height: 1.6;
      color: #222222;
      margin: 0;
      padding: 0;
      background-color: #f4f6f8;
    }

    header {
      background-color: #003366;
      color: #ffffff;
      padding: 20px;
      max-width: 960px;
      margin: 0 auto;
      box-sizing: border-box;
    }

    h1 {
      margin: 0 0 10px 0;
      font-size: 2rem;
    }

    nav {
      display: flex;
      gap: 16px;
    }

    nav a {
      color: #e2e8f0;
      text-decoration: none;
      font-weight: 500;
    }

    nav a:hover {
      text-decoration: underline;
      color: #ffffff;
    }

    main {
      max-width: 960px;
      margin: 24px auto;
      padding: 24px;
      background-color: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      box-sizing: border-box;
    }

    section {
      margin-bottom: 24px;
    }

    h2 {
      font-size: 1.5rem;
      color: #003366;
      margin-top: 0;
    }

    img {
      max-width: 100%;
      height: auto;
      border-radius: 4px;
      margin-top: 12px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-weight: 500;
    }

    input[type="text"],
    input[type="email"] {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid #ccc;
      border-radius: 4px;
      box-sizing: border-box;
    }

    button {
      padding: 10px 20px;
      background-color: #003366;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }

    button:hover {
      background-color: #002244;
    }

    footer {
      max-width: 960px;
      margin: 0 auto 24px auto;
      padding: 16px;
      text-align: center;
      font-size: 0.875rem;
      color: #666666;
    }
  </style>
</head>
<body>

  <header>
    <h1>STT Cipasung</h1>
    <nav>
      <a href="#">Home</a>
      <a href="#">Programs</a>
      <a href="#">Contact</a>
    </nav>
  </header>

  <main>
    <section>
      <h2>About Us</h2>
      <p>STT Cipasung is a technology college in Tasikmalaya.</p>
      <img src="https://placehold.co/600x300?text=STT+Cipasung" alt="Kampus Sekolah Tinggi Teknologi Cipasung">
    </section>

    <section>
      <h2>Contact Us</h2>
      <form action="#" method="post">
        <div class="form-group">
          <label for="name">Name</label>
          <input type="text" id="name" name="name" placeholder="Masukkan nama Anda" required>
        </div>
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="nama@email.com" required>
        </div>
        <button type="submit">Send</button>
      </form>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 STT Cipasung. All rights reserved.</p>
  </footer>

</body>
</html>
